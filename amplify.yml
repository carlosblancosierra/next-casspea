version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - rm -rf node_modules
        - pnpm install
    build:
      commands:
        # Next.js on Amplify only sees, at runtime, the variables written to
        # .env.production during the build. ADVENT_PREVIEW_PASSWORD guards the
        # private Advent landing (middleware.ts); without it those pages 404.
        - env | grep -e '^ADVENT_PREVIEW_PASSWORD=' >> .env.production || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
