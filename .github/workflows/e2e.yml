name: E2E

# A real browser buys a box from the real storefront, talking to the real
# casspea-v2 API, with only Stripe stubbed. See e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: casspea-v2 branch or commit to test against
        default: main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_HOST: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: 1
      E2E_DB_PATH: ${{ github.workspace }}/e2e.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Check out the API (casspea-v2)
        uses: actions/checkout@v4
        with:
          repository: carlosblancosierra/casspea-v2
          ref: ${{ inputs.backend_ref || 'main' }}
          path: backend
          # Needed only if casspea-v2 is private: a read-only token for it.
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --settings=erp.settings_e2e -v0
          python manage.py loaddata initial_discounts initial_product_category initial_products \
            initial_allergens initial_flavour_categories initial_flavours initial_shipping \
            --settings=erp.settings_e2e
          nohup python manage.py runserver 8000 --settings=erp.settings_e2e --noreload > ../api.log 2>&1 &

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and start the storefront
        run: |
          pnpm build
          nohup pnpm start -p 3000 > storefront.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 120000 http://localhost:8000/api/checkout/store-status/ http://localhost:3000/

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Upload the report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            api.log
            storefront.log
          retention-days: 7
